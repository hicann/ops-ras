ops-ras:
  commiter:
    ""
  team: "ops-ras" ##组件名称
  src:
    release:
      - reliability
    unrelease:
      - examples
      - experimental
      - tests
      - "*/*/tests"
      - "*/*/examples"
      - "*/*/*/op_api"
      - "*/*/op_api"
      - "*/*/op_kernel/arch35"
      - "**/*_def.cpp"
      - "**/*_apt.cpp"
      - "**/*tiling*data*.h"
      - "**/*tiling*key*.h"
      - "*/*/op_host/**/*.h"
      - "*/*/op_api/**/*.h"
      - "*/*/op_graph/**/*.h"
      - "*/*/op_graph/**/*.cpp"
      - "*/*/op_kernel_aicpu/**/*.h"
  llt:
    ut_check: true
    st_check: false

reliability@ops-ras:
  src:
    release:
      style:
        - ops/ops-ras/reliability/CMakeLists.txt
        - ops/ops-ras/reliability/obfuscation_calculate/CMakeLists.txt
        - ops/ops-ras/reliability/obfuscation_calculate/docs/
        - ops/ops-ras/reliability/obfuscation_calculate/op_host/
        - ops/ops-ras/reliability/obfuscation_setup/CMakeLists.txt
        - ops/ops-ras/reliability/obfuscation_setup/docs/
        - ops/ops-ras/reliability/obfuscation_setup/op_host/
        - ops/ops-ras/reliability/crypto/CMakeLists.txt
        - ops/ops-ras/reliability/crypto/docs/
        - ops/ops-ras/reliability/crypto/op_host/
      opensource_style: null
      kernel_style: null
    unrelease:
      test_code:
        - ops/ops-ras/reliability/obfuscation_calculate/tests/
        - ops/ops-ras/reliability/obfuscation_setup/tests/
        - ops/ops-ras/reliability/crypto/tests/
      non_delivery: null
      open_source: null
